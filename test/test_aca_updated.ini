# Created by aurig extended test on 2026-01-27
# Extended INI with board, sim, and includes sections
# CONFIGURATION
	[config]
# top level working directory
workdir = examples/demo_util/src
top_level = demo_util_fifo
# synplify, precision, vivado, ise, quartus, Libero
synth_tool = precision
synth_path = C:/MentorGraphics/PS2019.2_64-bit/Mgc_home/bin
# simulator selection
simulator = active-hdl
simulator_path = C:/Aldec/Active-HDL-11.1-x64/BIN
# LIBRARIES
	[libraries]
# ignore libraries as they are already added by the simulator or
# synthesizer and do not need to be searched
ieee = ignore
std  = ignore
# add libraries. For each library used by the top module the path
# to the source vhd files shall be added here
demo_util_lib = examples/demo_util/src
# DEVICE
	[device]
manufacturer = lattice
family = ECP5
part = FTGS546
speed = 2
# NEW: BOARD CONSTRAINTS
	[board]
xdc_files = constraints/lattice/ecp5_board/pins.xdc, constraints/lattice/ecp5_board/timing.xdc
sdc_files = constraints/lattice/ecp5_board/timing.sdc
# NEW: SIMULATION CONFIG
	[sim]
top_tb = tb_demo_util_fifo
tb_lib = tb_work
run_time = 1us
# NEW: GLOBAL INCLUDES
	[includes]
global = examples/demo_util/src, examples/demo_util/include
# GENERICS
	[generics]
### * asynchronous fifo
g_dual_clock = true
### * First Word Fall Through
g_fwft = false
### * fifo depth
g_wr_depth = 16
### * write data width
g_wr_data_w = 8
### * read data width
g_rd_data_w = 8
### * read latency: 1 or 2 clock cycles
g_rd_latency = 1
### * read enable internal control
g_ren_ctrl = true
### * write enable internal control
g_wen_ctrl = true
### * almost empty limit
g_almost_empty_limit = 1
### * almost full_limit
g_almost_full_limit = 14
